name: Application Android

# Same recipe as the Encyclopédie de la vie: the robot builds the app, signs it, and publishes it
# as a GitHub « release ». The app finds it by itself and offers « Nouvelle mise à jour ! ».
on:
  push:
    branches: [main]
    paths: ["app/**", "tools/build-app.mjs", "tools/polices-locales.py", "android-ressources/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Construire la page
        run: |
          npm install --no-audit --no-fund
          APK_VERSION=${{ github.run_number }} node tools/build-app.mjs
          python3 tools/polices-locales.py dist/apk
          # Update package: the app downloads it by itself, nothing to reinstall.
          (cd dist/apk && zip -qr ../../web.zip .)
          ls -la web.zip
      - name: Préparer le projet Android
        run: |
          npm install --save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/text-to-speech@6 @capgo/capacitor-updater@7.53.0 @capacitor/app@7
          npx cap add android
          pip install pillow
          python android-ressources/remplacer.py
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
          grep -q ACCESS_NETWORK_STATE android/app/src/main/AndroidManifest.xml || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />#' android/app/src/main/AndroidManifest.xml
          echo "Modules du téléphone inclus :"; cat android/app/src/main/assets/capacitor.plugins.json
          # Safety: stop if the voice or the updater is missing.
          grep -q TextToSpeech android/app/src/main/assets/capacitor.plugins.json
          grep -q CapacitorUpdater android/app/src/main/assets/capacitor.plugins.json
      - name: Compiler
        run: cd android && ./gradlew assembleRelease --no-daemon -q
      - name: Signer
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 $APK aligne.apk
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" || { echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD manquants (Settings > Secrets and variables > Actions)"; exit 1; }
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/cle.jks" || { echo "::error::La clé collée n'est pas du base64 valide"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/cle.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1 || { echo "::error::La clé ne s'ouvre pas avec ce mot de passe"; exit 1; }
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks "$RUNNER_TEMP/cle.jks" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out footdex.apk aligne.apk
          rm -f "$RUNNER_TEMP/cle.jks"
          ls -la footdex.apk
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" footdex.apk web.zip \
            --title "Footdex Android, version 1.${{ github.run_number }}" \
            --notes "Ouvrir footdex.apk sur le téléphone Android et toucher Installer. Tout est dans l'application : elle marche sans Internet. Les mises à jour suivantes se font dans l'application.

          web.zip sha256 : $(sha256sum web.zip | cut -d' ' -f1)" \
            --latest
